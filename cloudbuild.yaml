steps:
  # ── Step 1: Build backend image ──────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/maintenance-repo/backend"
      - "-f"
      - "devops/Dockerfile.backend"
      - "."
    id: "build-backend"

  # ── Step 2: Push backend image ───────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/maintenance-repo/backend"
    id: "push-backend"
    waitFor: ["build-backend"]

  # ── Step 3: Deploy backend to Cloud Run ──────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "maintenance-backend"
      - "--image"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/maintenance-repo/backend"
      - "--platform"
      - "managed"
      - "--region"
      - "europe-west1"
      - "--allow-unauthenticated"
      - "--add-cloudsql-instances"
      - "$PROJECT_ID:europe-west1:maintenanceusta-db"
      - "--set-env-vars"
      - "DB_HOST=localhost,DB_PORT=3306,DB_NAME=maintenance_db,DB_USER=maintenance_user,CORS_ORIGINS=$$FRONTEND_URL"
      - "--update-secrets"
      - "DB_PASSWORD=db-password:latest,FRONTEND_URL=frontend-url:latest"
    id: "deploy-backend"
    waitFor: ["push-backend"]

  # ── Step 4: Build frontend image ─────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/maintenance-repo/frontend"
      - "-f"
      - "devops/Dockerfile.frontend"
      - "."
    id: "build-frontend"
    waitFor: ["deploy-backend"] # wait so backend URL exists

  # ── Step 5: Push frontend image ──────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/maintenance-repo/frontend"
    id: "push-frontend"
    waitFor: ["build-frontend"]

  # ── Step 6: Deploy frontend to Cloud Run ─────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "maintenance-frontend"
      - "--image"
      - "europe-west1-docker.pkg.dev/$PROJECT_ID/maintenance-repo/frontend"
      - "--platform"
      - "managed"
      - "--region"
      - "europe-west1"
      - "--allow-unauthenticated"
    id: "deploy-frontend"
    waitFor: ["push-frontend"]

# Store built images in Container Registry
images:
  - "europe-west1-docker.pkg.dev/$PROJECT_ID/maintenance-repo/backend"
  - "europe-west1-docker.pkg.dev/$PROJECT_ID/maintenance-repo/frontend"

# Build timeout — 20 minutes should be enough
timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
