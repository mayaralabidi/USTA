server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to Cloud Run backend
    # REPLACE the proxy_pass value with your actual Cloud Run backend URL
    location /api/ {
        proxy_pass https://maintenance-backend-107717003850.europe-west1.run.app/api/;
        proxy_set_header Host maintenance-backend-107717003850.europe-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }
}